name: Android v0.8 analytics build

on:
  push:
    branches: [android-v08-analytics-backup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      VOICEVOX_VERSION: 0.17.0
      ONNX_VERSION: 1.23.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap verified Gradle Wrapper 8.9
        run: bash tools/bootstrap-wrapper.sh

      - name: Ensure wrapper executable
        run: chmod +x gradlew

      - name: Install Android SDK contract
        shell: bash
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$sdk_root/cmdline-tools/bin:$sdk_root/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Restore official VOICEVOX bundle
        shell: bash
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/voicevox"
          mkdir -p "$work"
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/VOICEVOX/voicevox_core/releases/download/${VOICEVOX_VERSION}/download-linux-x64" \
            --output "$work/download"
          chmod +x "$work/download"
          accept_download() {
            set +o pipefail
            yes | "$@"
            status=${PIPESTATUS[1]}
            set -o pipefail
            test "$status" -eq 0
          }
          for arch in arm64 x64; do
            mkdir -p "$work/$arch"
            (
              cd "$work/$arch"
              accept_download "$work/download" --os android --cpu-arch "$arch" --only c-api --c-api-version "$VOICEVOX_VERSION"
              accept_download "$work/download" --os android --cpu-arch "$arch" --only onnxruntime --onnxruntime-version "$ONNX_VERSION"
            )
          done
          mkdir -p "$work/common"
          (
            cd "$work/common"
            accept_download "$work/download" --only dict
            accept_download "$work/download" --only models --models-version "$VOICEVOX_VERSION" --models-pattern '11.vvm'
            accept_download "$work/download" --only models --models-version "$VOICEVOX_VERSION" --models-pattern '15.vvm'
          )
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p app/src/main/voicevox/include app/src/main/assets/voicevox/dict
          find "$work" -type f -name voicevox_core.h -exec cp {} app/src/main/voicevox/include/voicevox_core.h \;
          # The official downloader keeps each requested CPU architecture under
          # its own work directory, but the extracted native subdirectory name
          # is release-dependent. Search within that architecture's directory
          # instead of assuming the ABI name appears in the path.
          for spec in "arm64:arm64-v8a" "x64:x86_64"; do
            arch="${spec%%:*}"
            abi="${spec##*:}"
            mkdir -p "app/src/main/jniLibs/$abi"
            core_lib="$(find "$work/$arch" -type f -name libvoicevox_core.so -print -quit)"
            onnx_lib="$(find "$work/$arch" -type f -name libvoicevox_onnxruntime.so -print -quit)"
            test -n "$core_lib" && test -n "$onnx_lib"
            cp "$core_lib" "app/src/main/jniLibs/$abi/libvoicevox_core.so"
            cp "$onnx_lib" "app/src/main/jniLibs/$abi/libvoicevox_onnxruntime.so"
          done
          find "$work" -type f -name '11.vvm' -exec cp {} app/src/main/assets/voicevox/11.vvm \;
          find "$work" -type f -name '15.vvm' -exec cp {} app/src/main/assets/voicevox/15.vvm \;
          dict_dir="$(find "$work" -type f -name sys.dic -printf '%h\n' | head -1)"
          test -n "$dict_dir"
          cp "$dict_dir"/* app/src/main/assets/voicevox/dict/
          python3 tools/verify_voice_bundle.py
          sha256sum -c SHA256SUMS-VOICEVOX-v07.txt

      - name: Android source secret scan
        run: |
          python3 - <<'SCAN'
          from pathlib import Path
          import re
          patterns = [rb'sk-[A-Za-z0-9_-]{20,}', rb'OPENAI_API_KEY', rb'api\.openai\.com']
          for path in Path('app/src/main').rglob('*'):
              if path.is_file() and path.suffix in ('.java', '.js', '.json', '.xml', '.html'):
                  assert not any(re.search(p, path.read_bytes()) for p in patterns), str(path)
          print('Android source secret scan: NONE')
          SCAN

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint debug
        run: ./gradlew --no-daemon lintDebug

      - name: Regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs | tee regression.txt

      - name: APK metadata and secret scan
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk org.shinyakushin.study.next.v07.preview

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shin-yakushin-v08-analytics-backup-debug
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/APK-SHA256SUMS.txt
            android/APK-METADATA.json
            android/APK-BADGING.txt
            android/APK-SIGNATURE.txt
            android/regression.txt
            android/app/build/reports/lint-results-debug.*

