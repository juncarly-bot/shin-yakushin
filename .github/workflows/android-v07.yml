name: Android v0.7 build

on:
  push:
    branches: [android-v07-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VOICEVOX_VERSION: 0.17.0
      ONNX_VERSION: 1.23.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK contract
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Restore official VOICEVOX bundle
        shell: bash
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/voicevox"
          mkdir -p "$work"
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/VOICEVOX/voicevox_core/releases/download/${VOICEVOX_VERSION}/download-linux-x64" \
            --output "$work/download"
          chmod +x "$work/download"
          cd "$work"
          yes | ./download --os android --only c-api --c-api-version "$VOICEVOX_VERSION"
          yes | ./download --os android --only onnxruntime --onnxruntime-version "$ONNX_VERSION"
          yes | ./download --only dict
          yes | ./download --only models --models-version "$VOICEVOX_VERSION" --models-pattern '{11,15}.vvm'
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/voicevox/include app/src/main/assets/voicevox/dict
          find "$work" -type f -name voicevox_core.h -exec cp {} app/src/main/voicevox/include/voicevox_core.h \;
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            find "$work" -type f -path "*/$abi/libvoicevox_core.so" -exec cp {} "app/src/main/jniLibs/$abi/libvoicevox_core.so" \;
            find "$work" -type f -path "*/$abi/libvoicevox_onnxruntime.so" -exec cp {} "app/src/main/jniLibs/$abi/libvoicevox_onnxruntime.so" \;
          done
          find "$work" -type f -name '11.vvm' -exec cp {} app/src/main/assets/voicevox/11.vvm \;
          find "$work" -type f -name '15.vvm' -exec cp {} app/src/main/assets/voicevox/15.vvm \;
          dict_dir="$(find "$work" -type f -name sys.dic -printf '%h\n' | head -1)"
          test -n "$dict_dir"
          cp "$dict_dir"/* app/src/main/assets/voicevox/dict/
          python3 tools/verify_voice_bundle.py
          sha256sum -c SHA256SUMS-VOICEVOX-v07.txt

      - name: Clean
        run: gradle --no-daemon clean

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Lint debug
        run: gradle --no-daemon lintDebug

      - name: Regression tests
        run: node --test tests/*.test.mjs

      - name: APK metadata and secret scan
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee APK-SHA256SUMS.txt
          unzip -p "$apk" AndroidManifest.xml >/dev/null
          if unzip -p "$apk" | strings | grep -E 'OPENAI_API_KEY|api\.openai\.com|sk-[A-Za-z0-9_-]{20,}|Authorization: Bearer'; then
            echo 'secret-like content found in APK' >&2
            exit 1
          fi
          echo "applicationId=org.shinyakushin.study.next.v07.preview" | tee APK-METADATA.txt
          stat -c 'size_bytes=%s' "$apk" | tee -a APK-METADATA.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shin-yakushin-v07-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256SUMS.txt
            APK-METADATA.txt

