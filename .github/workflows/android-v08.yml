name: Android v0.8 life balance build

on:
  push:
    branches: [android-v08-life-balance, android-v08-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      VOICEVOX_VERSION: 0.17.0
      ONNX_VERSION: 1.23.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap verified Gradle Wrapper 8.9
        run: bash tools/bootstrap-wrapper.sh

      - name: Ensure wrapper executable
        run: chmod +x gradlew

      - name: Install Android SDK contract
        shell: bash
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$sdk_root/cmdline-tools/bin:$sdk_root/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Restore official VOICEVOX bundle
        shell: bash
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/voicevox"
          mkdir -p "$work"
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/VOICEVOX/voicevox_core/releases/download/${VOICEVOX_VERSION}/download-linux-x64" \
            --output "$work/download"
          chmod +x "$work/download"
          accept_download() {
            set +o pipefail
            yes | "$@"
            status=${PIPESTATUS[1]}
            set -o pipefail
            test "$status" -eq 0
          }
          for arch in arm64 x64; do
            mkdir -p "$work/$arch"
            (
              cd "$work/$arch"
              accept_download "$work/download" --os android --cpu-arch "$arch" --only c-api --c-api-version "$VOICEVOX_VERSION"
              accept_download "$work/download" --os android --cpu-arch "$arch" --only onnxruntime --onnxruntime-version "$ONNX_VERSION"
            )
          done
          mkdir -p "$work/common"
          (
            cd "$work/common"
            accept_download "$work/download" --only dict
            accept_download "$work/download" --only models --models-version "$VOICEVOX_VERSION" --models-pattern '11.vvm'
            accept_download "$work/download" --only models --models-version "$VOICEVOX_VERSION" --models-pattern '15.vvm'
          )
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p app/src/main/voicevox/include app/src/main/assets/voicevox/dict
          find "$work" -type f -name voicevox_core.h -exec cp {} app/src/main/voicevox/include/voicevox_core.h \;
          # The official downloader keeps each requested CPU architecture under
          # its own work directory, but the extracted native subdirectory name
          # is release-dependent. Search within that architecture's directory
          # instead of assuming the ABI name appears in the path.
          for spec in "arm64:arm64-v8a" "x64:x86_64"; do
            arch="${spec%%:*}"
            abi="${spec##*:}"
            mkdir -p "app/src/main/jniLibs/$abi"
            core_lib="$(find "$work/$arch" -type f -name libvoicevox_core.so -print -quit)"
            onnx_lib="$(find "$work/$arch" -type f -name libvoicevox_onnxruntime.so -print -quit)"
            test -n "$core_lib" && test -n "$onnx_lib"
            cp "$core_lib" "app/src/main/jniLibs/$abi/libvoicevox_core.so"
            cp "$onnx_lib" "app/src/main/jniLibs/$abi/libvoicevox_onnxruntime.so"
          done
          find "$work" -type f -name '11.vvm' -exec cp {} app/src/main/assets/voicevox/11.vvm \;
          find "$work" -type f -name '15.vvm' -exec cp {} app/src/main/assets/voicevox/15.vvm \;
          dict_dir="$(find "$work" -type f -name sys.dic -printf '%h\n' | head -1)"
          test -n "$dict_dir"
          cp "$dict_dir"/* app/src/main/assets/voicevox/dict/
          python3 tools/verify_voice_bundle.py
          sha256sum -c SHA256SUMS-VOICEVOX-v07.txt

      - name: Configure persistent preview signing
        shell: bash
        env:
          RC_KEYSTORE_BASE64: ${{ secrets.RC_KEYSTORE_BASE64 }}
          RC_STORE_PASSWORD: ${{ secrets.RC_STORE_PASSWORD }}
          RC_KEY_ALIAS: ${{ secrets.RC_KEY_ALIAS }}
          RC_KEY_PASSWORD: ${{ secrets.RC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The secrets context is not allowed in step-level `if`, so decide here.
          if [ -z "${RC_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::RC signing secrets are absent; falling back to the throwaway debug key"
            exit 0
          fi
          keystore="$RUNNER_TEMP/shin-yakushin-rc.p12"
          printf '%s' "$RC_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          # The RC certificate fingerprint is public information and is pinned so
          # verify_apk.py can prove the APK was signed by the persistent RC key.
          {
            echo "RC_KEYSTORE_FILE=$keystore"
            echo "RC_STORE_PASSWORD=$RC_STORE_PASSWORD"
            echo "RC_KEY_ALIAS=$RC_KEY_ALIAS"
            echo "RC_KEY_PASSWORD=$RC_KEY_PASSWORD"
            echo "EXPECTED_SIGNING_CERT_SHA256=082513b4015567c3db6d721f19d31de11a44edb5a19ee47de8b5e71e2b92ef6e"
          } >> "$GITHUB_ENV"

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint debug
        run: ./gradlew --no-daemon lintDebug

      - name: Regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs | tee regression.txt

      - name: APK metadata and secret scan
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk org.shinyakushin.study.next.v07.preview

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shin-yakushin-v08-life-balance-debug
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/APK-SHA256SUMS.txt
            android/APK-METADATA.json
            android/APK-BADGING.txt
            android/APK-SIGNATURE.txt
            android/regression.txt
            android/app/build/reports/lint-results-debug.*

      - name: Assemble persistence instrumentation APK
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Upload persistence instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: shin-yakushin-v08-persistence-test-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Assemble migration QA APK
        run: ./gradlew --no-daemon assembleMigrationqa

      - name: Migration QA APK metadata and secret scan
        shell: bash
        env:
          APK_LABEL: migrationqa-
        run: |
          set -euo pipefail
          python3 tools/verify_apk.py app/build/outputs/apk/migrationqa/app-migrationqa.apk org.shinyakushin.study.next.v08.migrationqa

      - name: Upload migration QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shin-yakushin-v08-migrationqa-debug
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/migrationqa/app-migrationqa.apk
            android/APK-migrationqa-SHA256SUMS.txt
            android/APK-migrationqa-METADATA.json
            android/APK-migrationqa-BADGING.txt
            android/APK-migrationqa-SIGNATURE.txt

  persistence:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified application APK
        uses: actions/download-artifact@v4
        with:
          name: shin-yakushin-v08-life-balance-debug
          path: android
      - name: Download persistence instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: shin-yakushin-v08-persistence-test-apk
          path: android/app/build/outputs/apk/androidTest/debug
      - name: Download migration QA APK
        uses: actions/download-artifact@v4
        with:
          name: shin-yakushin-v08-migrationqa-debug
          path: android
      - name: Real Android persistence regression
        timeout-minutes: 25
        shell: bash
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$sdk_root/platform-tools:$sdk_root/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/persistence-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name persistence-ci --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          emulator -list-avds | grep -Fx persistence-ci
          # Android 35 under TCG software emulation cannot reach boot_completed
          # in a usable window (run 34537124484 burned 15 minutes and never
          # booted), so hardware acceleration is mandatory. The hosted runner
          # exposes /dev/kvm but the runner user is not in the kvm group, so
          # grant access explicitly and fail fast rather than silently degrade.
          if [ -e /dev/kvm ]; then
            sudo usermod -aG kvm "$USER" 2>/dev/null || true
            sudo chmod 666 /dev/kvm || true
          fi
          if ! test -w /dev/kvm; then
            echo "::error::/dev/kvm is not writable by the runner user; refusing to run TCG software emulation"
            ls -l /dev/kvm || true
            exit 1
          fi
          emulator -accel-check | tee accel-check.txt || true

          adb start-server
          emulator -avd persistence-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel on -cores 4 > emulator-persistence.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then tail -n 200 emulator-persistence.log || true; fi
            kill "$emulator_pid" 2>/dev/null || true
            exit "$rc"
          }
          trap cleanup EXIT
          booted=false
          for attempt in $(seq 1 300); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Emulator process exited before Android boot; startup log below"
              exit 1
            fi
            if adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q '^1$'; then
              booted=true
              echo "sys.boot_completed observed after about $((attempt * 2))s"
              break
            fi
            if [ $((attempt % 30)) -eq 0 ]; then
              echo "still waiting for emulator boot (attempt $attempt)"
              adb devices -l || true
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            echo "::error::Emulator did not report sys.boot_completed inside the bounded window"
            adb devices -l || true
            ps -ef | grep -i qemu | grep -v grep || true
            free -m || true
            df -h || true
            exit 1
          fi
          adb -s emulator-5554 wait-for-device
          adb -s emulator-5554 shell pm path android
          adb -s emulator-5554 shell cmd package list packages android >/dev/null
          adb -s emulator-5554 logcat -c || true
          adb -s emulator-5554 install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5554 install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb -s emulator-5554 shell pm list packages | tee installed-packages.txt
          adb -s emulator-5554 shell pm list instrumentation | tee instrumentation.txt
          grep -q "org.shinyakushin.study.next.PersistenceQa" instrumentation.txt
          adb -s emulator-5554 shell dumpsys package org.shinyakushin.study.next.v07.preview | grep -E "firstInstallTime|lastUpdateTime" | tee install-times.txt || true
          adb -s emulator-5554 shell run-as org.shinyakushin.study.next.v07.preview ls -la files | tee app-files-before-startup.txt || true
          adb -s emulator-5554 shell am instrument -w org.shinyakushin.study.next.v07.preview.test/org.shinyakushin.study.next.PersistenceQa | tee persistence-qa.txt
          grep -q "PERSISTENCE_QA passed=10 failed=0" persistence-qa.txt
          adb -s emulator-5554 shell run-as org.shinyakushin.study.next.v07.preview ls -la files | tee app-files-after-instrument.txt || true
          adb -s emulator-5554 shell run-as org.shinyakushin.study.next.v07.preview find . -name "study.sqlite3*" | tee app-state-files.txt || true
          python3 tools/check_emulator_startup.py | tee app-startup.txt

          # Migration rehearsal: the QA build has its own applicationId, so it installs
          # next to the preview app. Installing it must not disturb the preview package
          # or its data, and the QA process must survive its own startup.
          adb -s emulator-5554 install -r -t app/build/outputs/apk/migrationqa/app-migrationqa.apk
          adb -s emulator-5554 shell pm list packages | tee packages-after-migration-qa-install.txt
          grep -q "package:org.shinyakushin.study.next.v07.preview" packages-after-migration-qa-install.txt
          grep -q "package:org.shinyakushin.study.next.v08.migrationqa" packages-after-migration-qa-install.txt
          adb -s emulator-5554 logcat -c || true
          adb -s emulator-5554 shell am start -n org.shinyakushin.study.next.v08.migrationqa/org.shinyakushin.study.next.MainActivity | tee migration-qa-start.txt
          sleep 8
          adb -s emulator-5554 shell pidof org.shinyakushin.study.next.v08.migrationqa | tee migration-qa-pid.txt || true
          if [ ! -s migration-qa-pid.txt ]; then
            adb -s emulator-5554 shell ps -A | grep -F org.shinyakushin.study.next.v08.migrationqa | tee migration-qa-pid.txt
          fi
          test -s migration-qa-pid.txt
          adb -s emulator-5554 logcat -d -v brief | tee migration-qa-logcat.txt
          if grep -E "FATAL EXCEPTION|Process: org\.shinyakushin\.study\.next\.v08\.migrationqa.*died" migration-qa-logcat.txt; then
            echo "::error::the migration QA app crashed during startup"
            exit 1
          fi
          # The native read-only reader is exercised on the device by its own instrumentation.
          adb -s emulator-5554 shell am instrument -w org.shinyakushin.study.next.v07.preview.test/org.shinyakushin.study.next.MigrationQa | tee migration-qa-instrument.txt
          grep -q "MIGRATION_QA passed=9 failed=0" migration-qa-instrument.txt
          adb -s emulator-5554 shell run-as org.shinyakushin.study.next.v07.preview ls -la files | tee app-files-after-migration-qa.txt || true

      - name: Upload persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shin-yakushin-v08-persistence-evidence
          if-no-files-found: warn
          path: |
            android/persistence-qa.txt
            android/instrumentation.txt
            android/installed-packages.txt
            android/install-times.txt
            android/app-files-before-startup.txt
            android/app-files-after-instrument.txt
            android/app-state-files.txt
            android/emulator-persistence.log
            android/accel-check.txt
            android/app-startup.txt
            android/app-startup-ui.xml
            android/app-startup.png
            android/app-startup-crash.log
            android/app-startup-logcat.txt
            android/packages-after-migration-qa-install.txt
            android/migration-qa-start.txt
            android/migration-qa-pid.txt
            android/migration-qa-logcat.txt
            android/migration-qa-instrument.txt
            android/app-files-after-migration-qa.txt
