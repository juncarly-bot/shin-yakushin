plugins { id 'com.android.application' }
android {
    namespace 'org.shinyakushin.study.next'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'org.shinyakushin.study.next.v07.preview'
        testInstrumentationRunner 'org.shinyakushin.study.next.PersistenceQa'
        minSdk 26
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        targetSdk 35
        versionCode 7
        versionName '0.7.0-preview'
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress += ['vvm'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
