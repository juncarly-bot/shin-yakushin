plugins { id 'com.android.application' }

// Persistent preview/RC signing. The keystore and its passwords only ever live in
// GitHub Secrets and are decoded into $RUNNER_TEMP at build time; nothing here is
// committed. Without those secrets (fork or plain local build) the build falls back
// to the throwaway debug key so the project still assembles.
def rcKeystorePath = System.getenv('RC_KEYSTORE_FILE')
def rcStorePassword = System.getenv('RC_STORE_PASSWORD')
def rcKeyAlias = System.getenv('RC_KEY_ALIAS')
def rcKeyPassword = System.getenv('RC_KEY_PASSWORD')
def rcSigning = rcKeystorePath && rcStorePassword && rcKeyAlias && rcKeyPassword && file(rcKeystorePath).exists()
android {
    namespace 'org.shinyakushin.study.next'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'org.shinyakushin.study.next.v07.preview'
        testInstrumentationRunner 'org.shinyakushin.study.next.PersistenceQa'
        minSdk 26
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        targetSdk 35
        versionCode 8
        versionName '0.8.0-rc1'
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress += ['vvm'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (rcSigning) {
            rc {
                storeFile file(rcKeystorePath)
                storePassword rcStorePassword
                keyAlias rcKeyAlias
                keyPassword rcKeyPassword
                // v1 keeps the certificate readable by keytool on the QA host;
                // v2/v3 keep modern verification happy.
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        debug { if (rcSigning) signingConfig signingConfigs.rc }
        // Migration rehearsal only: a side-by-side installable build used to prove an
        // existing install's saved state migrates before that install is replaced.
        // It reuses the debug type (debuggable, same signing) but the applicationId is
        // overridden below so it can never collide with the preview app or its data.
        migrationqa {
            initWith debug
            if (rcSigning) signingConfig signingConfigs.rc
            versionNameSuffix '-migrationqa'
        }
        release { minifyEnabled false; if (rcSigning) signingConfig signingConfigs.rc }
    }
}

// Keep the preview applicationId exactly as-is for the normal debug/release builds and
// give only the rehearsal variant its own package. Changing the id in defaultConfig (or
// an applicationIdSuffix) would either move the real app or produce the wrong package.
androidComponents {
    onVariants(selector().withBuildType('migrationqa')) { variant ->
        variant.applicationId.set('org.shinyakushin.study.next.v08.migrationqa')
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
